services:
  ppm:
    image: ppm-standalone:1.2.2
    platform: linux/amd64
    pull_policy: never
    container_name: ppm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      PPM_DATA_DIR: /data
      PPM_PASSWORD: "a277aaecf5713e31f345a720fefc434f"
    volumes:
      - "./data:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
